[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm build"

[deploy]
startCommand = "pnpm exec vite preview --host 0.0.0.0 --port $PORT"
# Set VITE_API_URL (build time) to https://api.<domain>. Single-page app: preview serves index.html for all routes.
